<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySpeeder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <img src="../icons/icon-48.png" alt="Logo" class="logo">
        <span class="title">MySpeeder</span>
      </div>
      <span class="tag">Auto</span>
    </header>

    <main class="content">
      <div class="speed-display">
        <span id="speedValue" class="value">1.25</span>
        <span class="unit">x</span>
      </div>

      <div class="slider-wrapper">
        <input type="range" id="speedSlider" min="0.5" max="3.0" step="0.05" value="1.25">
      </div>

      <div class="quick-buttons">
        <button class="btn-preset" data-speed="1.0">1.0x</button>
        <button class="btn-preset" data-speed="1.25">1.25x</button>
        <button class="btn-preset" data-speed="1.5">1.5x</button>
        <button class="btn-preset" data-speed="1.75">1.75x</button>
        <button class="btn-preset" data-speed="2.0">2.0x</button>
      </div>
    </main>

    <footer class="footer">
      <span id="statusText" class="status">Persistente entre capítulos</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
